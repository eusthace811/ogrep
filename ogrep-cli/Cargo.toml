[package]
name = "ogrep-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Trigram-indexed grep — fast regex search for large codebases with client/server architecture"
keywords = ["grep", "search", "regex", "trigram", "cli"]
categories = ["command-line-utilities", "text-processing"]
readme = "../README.md"

[[bin]]
name = "ogrep"
path = "src/main.rs"

[features]
# Diagnostic builds only: phase timings without changing matching semantics.
profile-search = []

[dependencies]
ogrep-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
notify = "8.2"
rayon = "1"
regex = "1"
regex-syntax = "0.8"
fancy-regex = "0.14"
lru = "0.18.2"
fs2 = "0.4.3"
globset = "0.4.18"
memmap2 = "0.9"
memchr = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
predicates = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
