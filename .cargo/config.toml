# Crates come from crates.io, or from whatever the machine's own cargo
# config substitutes for it (a corporate Artifactory remote, say). Nothing
# registry-specific belongs here; see ./x doctor.

# Windows hardening: control-flow guard, CET shadow-stack compatibility and
# ASLR. The static CRT means ogrep.exe runs without the VC++ redistributable.
[target.'cfg(target_os = "windows")']
rustflags = ["-Ccontrol-flow-guard", "-Ctarget-feature=+crt-static", "-Clink-args=/DYNAMICBASE /CETCOMPAT"]
