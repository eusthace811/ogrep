<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ogrep lab</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="wordmark">ogrep <span>lab</span></div>
    <div class="facts" id="facts"></div>
    <div class="spacer"></div>
    <div class="tools">
      <button class="btn link" id="goto" type="button" title="Go to a file or definition">Go to file <kbd>Ctrl K</kbd></button>
      <button class="btn link" id="theme" type="button" title="Switch light and dark">Theme</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <main id="main"></main>
</div>
<noscript>ogrep lab needs JavaScript.</noscript>
</body>
</html>
