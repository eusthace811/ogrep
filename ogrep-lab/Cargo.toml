[package]
name = "ogrep-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A local, offline workbench for ogrep indexes: inspect, search, navigate the graph and history, and run evaluations"
readme = "README.md"

[[bin]]
name = "ogrep-lab"
path = "src/main.rs"

[dependencies]
# Reads the index, graph and history directly. Parsers are not needed to read
# a graph, only to build one, so the lab leaves them out.
ogrep-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
regex = "1"
memchr = "2"
rayon = "1"

[dev-dependencies]
tempfile = "3"
