[workspace]
members = ["zgrep-core", "zgrep-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Shengyu Fu"]

[workspace.dependencies]
zgrep-core = { path = "zgrep-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
blake3 = "1"
