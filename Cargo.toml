[workspace]
members = ["ogrep-core", "ogrep-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Shengyu Fu"]

[workspace.dependencies]
ogrep-core = { path = "ogrep-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
blake3 = "1"
