[workspace]
members = ["ogrep-core", "ogrep-cli", "ogrep-lab"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ogrep-core = { path = "ogrep-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
blake3 = "1"
