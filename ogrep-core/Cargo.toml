[package]
name = "ogrep-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trigram index library for fast full-text search on large codebases"
keywords = ["trigram", "search", "index", "grep", "full-text"]
categories = ["text-processing", "algorithms"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true }
memmap2 = "0.9"
memchr = "2"
regex = "1"
regex-syntax = "0.8"
rayon = "1"
ignore = "0.4"
globset = "0.4.18"
encoding_rs = "0.8"
fs2 = "0.4.3"
# Operations files (compose, Kubernetes, Backstage, Prometheus rules) for the
# incident features.
serde_yaml = "0.9"
# Source structure (--scope, --kind, --in, ranking): parsers for the languages
# below, compiled in. Build with `--no-default-features` to leave them out.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }

[features]
default = ["structure"]
structure = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-php",
]

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus"] }

[[bench]]
name = "trigram_extraction"
harness = false

[[bench]]
name = "query_execution"
harness = false

[[bench]]
name = "index_build"
harness = false
